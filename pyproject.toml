[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepnode"
version = "0.1.0"
description = "A pure-Python feedforward neural network library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Joshua Cao"}]

[tool.setuptools.packages.find]
where = ["src"]